<style>
/* Modern CSS Reset & Core Variables */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: env(safe-area-inset-top, 80px); }
:root {
  --bg: #f2f8ff;
  --ink: #0b2545;
  --muted: #5b6478;
  --line: #e4e8f4;
  --a: #0284c7;
  --b: #f5b301;
}

body {
  margin: 0;
  background: var(--bg);
  background: radial-gradient(900px 500px at 85% -5%, #bae6fd99, transparent 60%),
              radial-gradient(700px 420px at -5% 18%, #fde68a66, transparent 55%), var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font: 400 16px/1.65 "Plus Jakarta Sans", system-ui, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: #ffffffe0; z-index: 60; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; height: auto; }
ul { list-style: none; padding: 0; margin: 0; }
h1, h2 { color: var(--ink); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
.narrow { max-width: 720px; }

/* Custom Premium SVG Logo Styles */
.zl { width: 50px; height: 50px; border-radius: 12px; box-shadow: 0 10px 20px -5px rgba(2, 132, 199, 0.4); flex-shrink: 0; }
.logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; text-decoration: none; letter-spacing: -0.02em; color: var(--ink); }
.logo-text { display: flex; flex-direction: column; line-height: 1.05; }
.logo-text em { font-size: 14px; font-style: normal; font-weight: 800; background: linear-gradient(90deg, #0284c7, #d99a00); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Header & Navigation */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: #ffffffef; backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); box-shadow: 0 8px 30px -24px #0284c7; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 14px; height: 76px; }
nav > ul { display: flex; gap: 4px; align-items: center; }
nav li { position: relative; }
nav > ul > li > a { display: block; padding: 10px 14px; border-radius: 10px; font-size: 14.5px; font-weight: 800; color: #1e293b; transition: 0.2s; }
nav > ul > li > a:hover, nav > ul > li > a.on { background: #e0f2fe; color: #0369a1; }
.car { display: none; background: none; border: 0; font-size: 16px; cursor: pointer; color: var(--muted); }
.dd > ul { display: none; position: absolute; top: 100%; left: 0; min-width: 250px; padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 40px #1e293b22; }
.dd:hover > ul, .dd:focus-within > ul { display: block; }
.dd:nth-last-child(-n+3) > ul { left: auto; right: 0; }
.dd > ul a { display: block; padding: 10px 12px; border-radius: 8px; font-size: 14px; color: #334155; font-weight: 700; }
.dd > ul a:hover { background: #e0f2fe; color: var(--a); }

/* Mobile Menu */
#mb { display: none; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; font: inherit; font-weight: 800; cursor: pointer; }
@media (max-width: 1260px) {
  #mb { display: block; }
  nav { display: none; position: absolute; left: 0; right: 0; top: 76px; background: #fff; border-bottom: 1px solid var(--line); padding: 10px 20px 24px; max-height: calc(100vh - 76px); overflow: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
  nav.open { display: block; }
  nav > ul { flex-direction: column; align-items: stretch; }
  .dd { display: flex; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #f1f5f9; }
  .dd > a { flex: 1; padding: 14px 0; }
  .car { display: block; padding: 14px; }
  .dd > ul { position: static; width: 100%; box-shadow: none; border: 0; padding: 0 0 12px 12px; display: none; border-left: 2px solid #e2e8f0; margin-left: 8px; }
  .dd:hover > ul, .dd:focus-within > ul { display: none; }
  .dd.open > ul { display: block !important; }
}

/* Hero Section */
.hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: 44px; align-items: center; padding-top: 60px; padding-bottom: 40px; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; padding-top: 30px; text-align: center; } .hero .btns { justify-content: center; } }
.eyebrow { display: inline-block; background: #fff; border: 1px solid #fde68a; color: #9a6b00; font-weight: 800; font-size: 13px; padding: 6px 16px; border-radius: 99px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.05em; }
.eyebrow::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f5b301; margin-right: 8px; }
h1 { font-size: clamp(34px, 5vw, 60px); line-height: 1.1; letter-spacing: -0.03em; margin: 0 0 20px; font-weight: 800; }
h2 { font-size: clamp(26px, 4vw, 38px); letter-spacing: -0.02em; margin: 0 0 12px; font-weight: 800; }
h2::after { content: ""; display: block; width: 54px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, #f5b301, #fcd34d); margin-top: 12px; }
.band h2::after { display: none; }
.g { background: linear-gradient(90deg, #0369a1, #0ea5e9 60%, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hc p, .lead { font-size: 18px; color: var(--muted); max-width: 58ch; margin: 0 0 28px; font-weight: 500; }
@media (max-width: 860px) { .hc p, .lead { margin: 0 auto 28px; } }
.himg { border-radius: 26px; box-shadow: 0 30px 60px -22px #0284c755; border: 1px solid var(--line); width: 100%; aspect-ratio: 4/3; object-fit: cover; animation: fl 7s ease-in-out infinite; }
@keyframes fl { 0%, 100% { transform: perspective(1100px) rotateY(-5deg) rotateX(2deg); } 50% { transform: perspective(1100px) rotateY(0deg) rotateX(0deg) translateY(-10px); } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: linear-gradient(135deg, #fcd34d, #f5b301 55%, #e09f00); color: #3b2a00; padding: 14px 28px; border-radius: 99px; text-decoration: none; font-weight: 800; font-size: 16px; border: 0; cursor: pointer; box-shadow: 0 12px 26px -10px #e09f00; transition: all 0.3s; }
.btn::after { content: " \2192"; transition: transform 0.3s; display: inline-block; margin-left: 4px; }
.btn:hover { filter: brightness(1.05); transform: translateY(-2px); }
.btn:hover::after { transform: translateX(4px); }
.btn.alt { background: #fff; color: #0369a1; border: 1px solid #bae6fd; box-shadow: none; margin-left: 12px; }
.btn.alt::after { display: none; }
.btn.alt:hover { background: #f0f9ff; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
@media (max-width: 500px) { .btns { flex-direction: column; } .btn.alt { margin-left: 0; } }

/* Grid & Cards */
.sec { padding-top: 50px; padding-bottom: 50px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; margin-top: 30px; }
.card { background: #ffffffd9; backdrop-filter: blur(8px); border: 1px solid transparent; background-clip: padding-box; border-radius: 24px; padding: 16px 16px 24px; text-decoration: none; transition: 0.3s; position: relative; }
.card::before { content: ""; position: absolute; inset: -1px; border-radius: 25px; background: linear-gradient(135deg, #bae6fd, #fde68a); z-index: -1; opacity: 0.5; transition: 0.3s; }
.card:hover { transform: translateY(-5px); box-shadow: 0 26px 44px -22px #0284c788; }
.card:hover::before { opacity: 1; }
.card img { border-radius: 16px; aspect-ratio: 16/10; object-fit: cover; width: 100%; margin-bottom: 16px; }
.card h3 { margin: 0 8px 6px; font-size: 20px; font-weight: 800; }
.card p { margin: 0 8px; color: var(--muted); font-size: 15px; }

/* Features & Why Us */
.pt { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px 24px 20px 64px; position: relative; font-weight: 700; text-decoration: none; color: var(--ink); }
.pt::before { content: "\2713"; position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; background: #fef3c7; color: #b45309; text-align: center; line-height: 28px; font-size: 15px; font-weight: 800; }
.why { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 24px; margin-top: 30px; }
.wc { background: #fff; border-radius: 24px; padding: 28px; border: 1px solid var(--line); transition: 0.3s; position: relative; z-index: 1; overflow: hidden; }
.wc::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--a), var(--b)); opacity: 0; transition: 0.3s; }
.wc:hover { box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08); transform: translateY(-4px); }
.wc:hover::before { opacity: 1; }
.wc svg { width: 56px; height: 56px; margin-bottom: 16px; }
.wc h3 { margin: 0 0 8px; font-size: 19px; font-weight: 800; }
.wc p { margin: 0; color: var(--muted); font-size: 15px; }

/* Steps */
.steps { counter-reset: s; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 30px; }
.steps li { counter-increment: s; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 28px; position: relative; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #fcd34d, #f5b301); color: #3b2a00; font-weight: 800; font-size: 18px; margin-bottom: 16px; }
.steps b { display: block; font-size: 18px; font-weight: 800; margin-bottom: 6px; }
.steps span { color: var(--muted); font-size: 15px; display: block; }

/* Contact Forms & Bands */
.two { display: grid; grid-template-columns: 1.1fr 1fr; gap: 44px; align-items: start; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
.enq { display: grid; gap: 16px; background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 32px; box-shadow: 0 24px 50px -30px #0284c766; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
input, select, textarea { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: #f8fafc; color: var(--ink); font: inherit; font-size: 15px; transition: 0.2s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--a); background: #fff; box-shadow: 0 0 0 3px #e0f2fe; }
.msg { margin: 0; color: #166534; font-weight: 700; background: #dcfce7; padding: 12px; border-radius: 8px; display: none; text-align: center; }
.msg.show { display: block; }
.band { background: linear-gradient(120deg, #0b2545, #1e3a8a); border-radius: 26px; padding: 48px; margin: 40px 0; display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between; color: white; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
.band h2 { margin: 0; color: white; border: 0; }
.band p { margin: 8px 0 0; color: #bae6fd; font-size: 18px; }
.band .btn { background: #f5b301; color: #000; box-shadow: 0 10px 20px rgba(245,179,1,0.4); }
@media (max-width: 768px) { .band { text-align: center; justify-content: center; padding: 32px 20px; } }

/* FAQs & Chips */
.faq { max-width: 860px; margin-top: 30px; }
details { background: #fff; border: 1px solid var(--line); border-radius: 16px; margin-bottom: 16px; overflow: hidden; transition: 0.3s; }
details:hover { border-color: var(--a); }
summary { padding: 20px 24px; cursor: pointer; font-weight: 800; font-size: 17px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--a); font-size: 24px; transition: 0.3s; font-weight: 400; }
details[open] summary::after { transform: rotate(45deg); }
details p { padding: 0 24px 24px; margin: 0; color: var(--muted); font-size: 15.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.chips a, .chips span { background: #fff; border: 1px solid var(--line); padding: 10px 20px; border-radius: 99px; text-decoration: none; font-size: 14.5px; font-weight: 700; transition: 0.2s; color: var(--ink); }
.chips a:hover { border-color: var(--b); color: #9a6b00; background: #fef3c7; transform: translateY(-2px); }

/* Additional Styling */
.split { display: grid; grid-template-columns: 1.1fr 1fr; gap: 44px; align-items: center; }
.split img { border-radius: 26px; border: 1px solid #bae6fd; box-shadow: 0 30px 50px -28px #0284c788; width: 100%; aspect-ratio: 16/10; object-fit: cover; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
.stat { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; }
.stat b { font-size: clamp(60px, 8vw, 86px); line-height: 1; background: linear-gradient(90deg, #0284c7, #f5b301); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 900; }
.stat span { font-size: 22px; font-weight: 800; }

/* Footer */
footer { background: linear-gradient(180deg, #fff, #e0f2fe); border-top: 1px solid var(--line); margin-top: 60px; padding: 60px 0 30px; }
.fg { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; }
@media (max-width: 768px) { .fg { grid-template-columns: 1fr 1fr; } }
@media (max-width: 480px) { .fg { grid-template-columns: 1fr; } }
footer .logo { margin-bottom: 16px; }
footer p { color: var(--muted); font-size: 15px; max-width: 300px; margin-bottom: 16px; }
footer b { display: block; font-size: 18px; font-weight: 800; margin-bottom: 20px; }
footer li { margin-bottom: 12px; }
footer li a { color: var(--muted); font-size: 15px; font-weight: 600; transition: 0.2s; }
footer li a:hover { color: #b45309; padding-left: 4px; }
.copy { text-align: center; margin-top: 60px; padding-top: 24px; border-top: 1px solid #bae6fd; color: #64748b; font-size: 14px; }

/* Floating Action Button & Animations */
.fab { position: fixed; right: 24px; bottom: 24px; z-index: 90; background: linear-gradient(135deg, #fcd34d, #f5b301); color: #3b2a00; font-weight: 800; padding: 16px 28px; border-radius: 99px; box-shadow: 0 14px 30px -10px #e09f00; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
.fab:hover { transform: translateY(-4px); box-shadow: 0 18px 36px -10px #e09f00; filter: brightness(1.05); }
.rv { opacity: 0; transform: translateY(30px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
.rv.in { opacity: 1; transform: translateY(0); }
@media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } .himg { animation: none; } }
</style>
