<style>

a{color:inherit}ul{list-style:none;padding:0;margin:0}h1,h2,h3{margin:0}p{margin:0 0 14px}svg{max-width:100%}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}

/* header + 3D logo */
#hdr{position:sticky;top:0;z-index:50;background:rgba(7,26,61,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.1);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:16px;height:74px}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;color:#fff;flex:none}
.lg{width:50px;height:50px;filter:drop-shadow(0 8px 12px rgba(14,165,233,.55));transition:transform .4s}.logo:hover .lg{transform:rotate(-8deg) scale(1.06)}
.wm{display:flex;flex-direction:column;line-height:1;font-weight:800}

nav#nv{flex:1;display:flex;justify-content:center}nav>ul{display:flex;gap:2px}nav li{position:relative}nav a{text-decoration:none}

.car{display:none;background:none;border:0;font-size:16px;cursor:pointer;color:#CFE3FF}
.dd>ul{display:none;position:absolute;top:100%;left:0;min-width:240px;padding:8px;background:#0B2A5E;border:1px solid rgba(255,255,255,.14);border-radius:14px;box-shadow:0 24px 48px -16px #000a}
.dd:hover>ul,.dd:focus-within>ul{display:block}.dd:nth-last-child(-n+3)>ul{left:auto;right:0}
.dd>ul a{display:block;padding:8px 12px;border-radius:8px;font-size:14px;color:#CFE3FF}.dd>ul a:hover{background:rgba(255,255,255,.1);color:#fff}
#mb{display:none;background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;margin-left:auto}
.hq{flex:none;padding:10px 18px;font-size:14px}
/* buttons */
.btn{display:inline-block;background:linear-gradient(135deg,#FFE08A,#F5B301 55%,#E09F00);color:#3B2A00;padding:13px 26px;border-radius:99px;text-decoration:none;font:inherit;font-weight:800;border:0;cursor:pointer;box-shadow:0 14px 28px -12px #E09F00;transition:transform .2s,filter .2s}
.btn:hover{filter:brightness(1.06);transform:translateY(-2px)}.btn::after{content:" \2192"}.btn.alt::after{content:""}
.btn.alt{background:#fff;color:#0369A1;border:1px solid #BAE6FD;box-shadow:none}
.btns{display:flex;flex-wrap:wrap;gap:12px}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:64px 0 52px;background:radial-gradient(900px 520px at 88% -10%,rgba(14,165,233,.6),transparent 60%),radial-gradient(700px 420px at -5% 35%,rgba(245,179,1,.25),transparent 55%),linear-gradient(160deg,#071A3D,#0B2A5E 60%,#0B3B7E)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 70% 30%,#000,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 30%,#000,transparent 70%)}
.hgrid{position:relative;display:grid;grid-template-columns:1.02fr 1fr;gap:36px;align-items:center}
.eyebrow{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#FFE08A;font-weight:700;font-size:13px;padding:6px 15px;border-radius:99px;margin-bottom:18px;backdrop-filter:blur(6px)}
h1{font-size:clamp(34px,5vw,58px);line-height:1.06;letter-spacing:-.035em;font-weight:800;margin-bottom:16px}
.hero h1{color:#fff}.g{background:linear-gradient(90deg,#FFE08A,#F5B301);-webkit-background-clip:text;background-clip:text;color:transparent}
.hc p{font-size:18px;color:#CFE3FF;max-width:56ch;margin-bottom:26px}
.hero .btn.alt{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.hbul{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:24px;color:#CFE3FF;font-size:14px;font-weight:600}.hbul li::before{content:"\2713";color:var(--g2);margin-right:7px;font-weight:800}
.hart .art svg{display:block;width:100%;height:auto;filter:drop-shadow(0 30px 40px rgba(0,0,0,.35));animation:fl 7s ease-in-out infinite}

/* sections */
.sec{padding:66px 0}.sec.alt{background:linear-gradient(180deg,#EAF4FF,#F4F9FF)}.sec.tr{padding:0;margin-top:-26px;position:relative;z-index:2}
.hd{margin-bottom:30px}.hd h2,.sec h2{font-size:clamp(26px,3.2vw,38px);letter-spacing:-.025em;font-weight:800;line-height:1.15}
.hd h2::after,.split h2::after,.two h2::after{content:"";display:block;width:56px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--g),var(--g2));margin-top:12px}
.hd p{color:var(--muted);font-size:17px;margin:12px 0 0;max-width:62ch}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g1{grid-template-columns:1fr}
.tc,.uc,.pt,.card,.ph{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#BAE6FD,#FDE68A) border-box;border:1px solid transparent;border-radius:22px;transition:transform .25s,box-shadow .25s}
.tc{padding:22px;text-decoration:none;display:block}.tc:hover,.card:hover{transform:translateY(-5px);box-shadow:0 26px 44px -24px rgba(14,165,233,.55)}
.tc h3{font-size:18px;margin:12px 0 6px;letter-spacing:-.01em}.tc p{margin:0;color:var(--muted);font-size:15px}.tile{display:block}
.uc{padding:18px 20px;border-left:4px solid var(--g)}.uc b{display:block}.uc span{color:var(--muted);font-size:15px}
.pt{padding:16px 18px 16px 52px;position:relative;font-weight:600}.pt::before{content:"\2713";position:absolute;left:16px;top:14px;width:26px;height:26px;border-radius:50%;background:#FEF3C7;color:#B45309;display:grid;place-items:center;font-size:14px;font-weight:800}
.card{padding:12px 12px 20px;text-decoration:none;display:block}.card h3{margin:14px 8px 4px;font-size:18px}.card p{margin:0 8px;color:var(--muted);font-size:15px}
.cimg{border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#EAF4FF,#FFF6D6)}.cimg svg{display:block;width:100%;height:auto}
.more{display:inline-block;margin-top:10px;color:#0369A1;font-weight:700;font-size:14px}.tl{color:#0369A1;font-weight:700;text-decoration:none}
.split,.two{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center}.two{align-items:start}
.split p,.two p{color:var(--muted);font-size:17px}.split .art svg{width:100%;height:auto;border-radius:26px;box-shadow:0 30px 50px -30px rgba(14,165,233,.6)}
.lead{font-size:18px;color:var(--muted)}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}.bt{grid-column:span 2;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#BAE6FD,#FDE68A) border-box;border:1px solid transparent;border-radius:28px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.bt:hover{transform:translateY(-5px);box-shadow:0 30px 50px -26px rgba(14,165,233,.6)}.b0,.b1{grid-column:span 3}
.bti{padding:18px 22px 24px}.bti h3{font-size:21px;letter-spacing:-.015em}.bti p{color:var(--muted);margin:6px 0 0;font-size:15px}
/* trust, steps, stats */
.trust{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 30px 50px -34px rgba(7,26,61,.5)}
.tb{display:flex;gap:14px;align-items:center}.tb b{display:block}.tb span{color:var(--muted);font-size:14px}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.steps>li{counter-increment:s;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;position:relative}
.steps>li::before{content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#FFE08A,#F5B301);color:#3B2A00;font-weight:800;margin-bottom:12px;box-shadow:0 8px 16px -6px #E09F00}
.steps b{display:block;font-size:18px}.steps span{color:var(--muted);font-size:15px;display:block;margin-top:4px}.steps ul{margin-top:10px}.steps ul li{font-size:14px;padding-left:20px;position:relative;margin-bottom:5px}.steps ul li::before{content:"\2713";position:absolute;left:0;color:#0EA5E9;font-weight:800}
.statband{background:linear-gradient(120deg,#071A3D,#0B3B7E);color:#fff;padding:44px 0}.sb{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;text-align:center}
.sb b{display:block;font-size:56px;line-height:1;font-weight:800;background:linear-gradient(90deg,#FFE08A,#F5B301);-webkit-background-clip:text;background-clip:text;color:transparent}.sb span{color:#CFE3FF;font-weight:600}
.stat{display:flex;align-items:baseline;gap:14px;margin:6px 0 10px}.stat b{font-size:76px;line-height:1;background:linear-gradient(90deg,#0284C7,#F5B301);-webkit-background-clip:text;background-clip:text;color:transparent}.stat span{font-size:20px;font-weight:700}
.ph{padding:24px 26px;position:relative}.ph .n{position:absolute;right:20px;top:10px;font-size:64px;font-weight:800;color:#FDE68A;line-height:1}.ph h3{font-size:21px}.ph p{color:var(--muted)}.ph li{padding-left:22px;position:relative;margin-bottom:6px;font-size:15px}.ph li::before{content:"\2713";position:absolute;left:0;color:#0EA5E9;font-weight:800}
/* chips, marquee */
.chips{display:flex;flex-wrap:wrap;gap:10px}.chips a,.chips span{background:#fff;border:1px solid var(--line);padding:9px 17px;border-radius:99px;text-decoration:none;font-size:14px;font-weight:600;transition:.2s}.chips a:hover{border-color:var(--g);color:#9A6B00;transform:translateY(-2px)}
.marq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:12px;width:max-content;animation:mq 45s linear infinite}.track span{background:#fff;border:1px solid var(--line);padding:11px 22px;border-radius:99px;font-weight:700;white-space:nowrap;box-shadow:0 10px 20px -16px #0EA5E9}@keyframes mq{to{transform:translateX(-50%)}}
.ticks li{padding:9px 0 9px 30px;position:relative;border-bottom:1px solid var(--line)}.ticks li::before{content:"\2713";position:absolute;left:0;color:#B45309;font-weight:800}
/* faq, band, form */
.faq{max-width:900px}details{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:12px;transition:box-shadow .2s}details[open]{box-shadow:0 18px 34px -24px rgba(14,165,233,.7);border-color:#BAE6FD}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:14px}summary::-webkit-details-marker{display:none}summary::after{content:"+";font-size:22px;line-height:1;color:var(--g)}details[open] summary::after{content:"\2013"}details p{margin:12px 0 0;color:var(--muted)}
.band{background:radial-gradient(500px 240px at 90% 0%,rgba(14,165,233,.5),transparent 60%),linear-gradient(120deg,#071A3D,#0B3B7E);color:#fff;border-radius:30px;padding:40px;margin:30px 0;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.band h2{color:#fff}.band p{margin:6px 0 0;color:#CFE3FF}
.enq{display:grid;gap:12px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 30px 56px -34px rgba(14,165,233,.7)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:#F4F9FF;color:var(--ink);font:inherit}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a)}.msg{margin:0;color:#0369A1;font-weight:600}.cd a{font-weight:700;color:#0369A1}
/* footer, fab */
footer{background:linear-gradient(180deg,#071A3D,#04112B);color:#CFE3FF;margin-top:50px;padding:48px 0 20px}.fg{display:grid;grid-template-columns:2fr 1fr 1fr;gap:34px}footer h4{color:#fff;margin:0 0 12px}footer li{margin-bottom:7px}footer a{text-decoration:none}footer li a:hover{color:var(--g2)}footer p{font-size:14px}.fb{border-top:1px solid rgba(255,255,255,.12);margin-top:30px;padding-top:16px}
.fab a{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;background:linear-gradient(135deg,#FFE08A,#F5B301);color:#3B2A00;text-decoration:none;font-weight:800;padding:13px 24px;border-radius:99px;box-shadow:0 16px 32px -10px #E09F00}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
@media(max-width:1180px){#mb{display:block}.hq{display:none}nav#nv{display:none;position:absolute;left:0;right:0;top:100%;background:#071A3D;border-bottom:1px solid rgba(255,255,255,.12);padding:10px 20px 18px;max-height:calc(100vh - 80px);overflow:auto}nav#nv.open{display:block}nav>ul{flex-direction:column}.dd{display:flex;flex-wrap:wrap;align-items:center}.dd>a{flex:1}.car{display:block;padding:8px 14px}.dd>ul{position:static;width:100%;box-shadow:none;border:0;background:transparent;padding:0 0 6px 12px}.dd:hover>ul,.dd:focus-within>ul{display:none}.dd.open>ul{display:block!important}}
@media(max-width:900px){.hgrid,.split,.two{grid-template-columns:1fr}.g3,.g4,.g2{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.bento{grid-template-columns:1fr}.bt,.b0,.b1{grid-column:auto}.hero{padding:40px 0 34px}.sec{padding:46px 0}.fg{grid-template-columns:1fr}.band{padding:28px 22px}.hart{order:2}.stat b{font-size:60px}}
@media(max-width:560px){.row{grid-template-columns:1fr}.wm b{font-size:19px}.lg{width:44px;height:44px}.hc p{font-size:16px}.btns .btn{flex:1 1 100%;text-align:center}.fab a{padding:12px 20px}input,select,textarea{font-size:16px}}
@media(prefers-reduced-motion:reduce){.hart .art svg,.track{animation:none}.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style></head>

nd your own process, so teams stop juggling spreadsheets and disconnected tools.","deep":"We start by mapping how work really flows, then deliver module by module with role-based access, audit trails and integrations to accounting, payment and messaging systems you already use.","build":[["Custom ERP modules","Inventory, purchase, sales, billing and HR."],["CRM systems","Leads, follow-ups, quotes and customer history."],["Workflow and approvals","Digital sign-off with reminders and logs."],["Integrations","Tally, SAP, Zoho, payment gateways and WhatsApp."],["Reports and dashboards","Live numbers for owners and managers."]],"stack":["Java",".NET","Python","PostgreSQL","Power BI","REST APIs","SSO","Docker"],"use":[["Manufacturing units","Production, stock and dispatch."],["Distribution companies","Orders, credit and collections."],["Service businesses","Tickets, field visits and invoicing."],["Multi-branch firms","One system across locations."]],"faq":[["Why build custom instead of buying a ready ERP?","Ready ERPs are good when your process is standard. Custom software helps when your workflow is unique or you want to avoid paying for unused features."],["Can we start small?","Yes. We deliver one module first, such as orders or approvals, and add more over time."]],"art":{"h":"server","k":"erp","c":"#F5B301","ch":["ERP","CRM","Approvals"],"f":"hub","fl":["Core ERP","CRM","Finance","Inventory","HR"]}},"consulting-it-strategy":{"id":"consulting-it-strategy","cat":"consulting","name":"IT Strategy","tag":"Roadmaps and technology choices aligned to your goals","intro":"Many technology problems start with unclear goals. Our IT strategy work links your business plan to the systems, team and budget you need, so you invest in the right things in the right order.","deep":"We review your current tools, interview stakeholders and produce a practical roadmap in plain language, with costs, risks and quick wins, not a long document nobody reads.","build":[["Technology audit","What you have, what works and what is missing."],["12-month roadmap","Priorities, milestones and owners."],["Build vs buy analysis","When to use ready software and when to build."],["Vendor evaluation","Compare options with clear scoring."],["Budget and team planning","Costs, hiring and skills needed."]],"stack":["Roadmaps","Cost models","Risk registers","Vendor scorecards","Architecture sketches","OKRs","KPIs","Workshops"],"use":[["Startups planning a product","Choose the right first version."],["Growing companies","Fix scattered tools before they slow you."],["Founders","Independent technology advice."],["Boards and investors","A clear plan for the next year."]],"faq":[["How long does a strategy engagement take?","Usually two to four weeks, depending on company size and how many systems we review."],["Do we have to build with you afterwards?","No. The roadmap is yours. You can execute it with us, your own team or other partners."]],"art":{"h":"bars","k":"roadmap","c":"#2563EB","ch":["Audit","Roadmap","Budget"],"f":"gantt","fl":["Audit","Roadmap","Build vs buy","Budget plan"]}},"consulting-cloud-devops":{"id":"consulting-cloud-devops","cat":"consulting","name":"Cloud & DevOps","tag":"Move to the cloud and automate releases","intro":"Cloud and DevOps practices make software releases faster, safer and cheaper to run. We move applications to AWS, Azure or Google Cloud and automate testing and deployment, so launching a feature is no longer a stressful event.","deep":"We design secure cloud setups with infrastructure as code, build CI/CD pipelines, and add monitoring and alerts. Cost reviews keep your cloud bill under control as usage grows.","build":[["Cloud migration","Move servers and databases with minimal downtime."],["CI/CD pipelines","Automatic build, test and deploy on every change."],["Containers and Kubernetes","Portable, scalable application packaging."],["Monitoring and alerts","Know about problems before customers do."],["Cost optimisation","Right-size servers and remove waste."]],"stack":["AWS","Azure","Google Cloud","Docker","Kubernetes","Terraform","GitHub Actions","Prometheus"],"use":[["Apps outgrowing one server","Scale without rewriting."],["Teams with slow releases","Release weekly or daily."],["High cloud bills","Cut waste with smarter setups."],["Regulated businesses","Backups, access control and audit logs."]],"faq":[["Which cloud should we choose?","It depends on your team, tools and budget. AWS, Azure and Google Cloud are all strong, and we compare them against your needs."],["Will migration cause downtime?","We plan migrations in stages with rollback options, so downtime is minimal and scheduled."]],"art":{"h":"cloud","k":"pipe","c":"#0EA5E9","ch":["CI/CD","Kubernetes","Monitoring"],"f":"flow","fl":["Code","Build","Test","Deploy","Monitor"]}},"consulting-architecture-review":{"id":"consulting-architecture-review","cat":"consulting","name":"Architecture Review","tag":"Find performance and security risks early","intro":"An architecture review is a health check for your software. Experienced engineers study your code, database and infrastructure to find what will slow you down, break under load or expose you to risk.","deep":"You receive a clear report with findings ranked by impact and effort, plus a fix list your team can start on immediately. We can also help implement the fixes.","build":[["Code quality review","Structure, tests and technical debt."],["Security assessment","Common vulnerabilities and access control gaps."],["Scalability checks","How the system behaves with more users."],["Database review","Slow queries, indexing and data design."],["Prioritised action plan","Fixes ranked by risk and effort."]],"stack":["Static analysis","Load testing","OWASP checklist","Profiling","Threat modelling","Code review","Cloud audit","Reports"],"use":[["Before a big launch","Avoid surprises on day one."],["After a slowdown","Find the real bottleneck."],["Before investment","An independent technical opinion."],["When  const hero_=`<section class="hero"><div class="wrap hgrid"><div class="hc"><span class="eyebrow">Software services company</span><h1>Software that takes your business <span class="g">further</span></h1><p>Space Technologies builds web and mobile software, advises on technology, supplies skilled developers and grows your business online.</p><div class="btns">${A('contact-enquiry','Get a free quote','btn')}${A('software-development','Our services','btn alt')}</div><ul class="hbul"><li>Free discovery call</li><li>Fixed milestones</li><li>Support after launch</li></ul></div><div class="hart">${art({h:'planet',c:B1,alt:'Space Technologies planet logo on a 3D platform'})}</div></div></section>`;
 const trust=sec('tr',`<div class="trust rv">${[['shield','Secure & confidential','Your ideas and data stay protected'],['clock','On-time delivery','Clear milestones and regular updates'],['team','Dedicated experts','Skilled engineers on every project'],['chat','Responsive support','Quick replies and care after launch']].map(t=>`<div class="tb">${tile(t[0],'#38BDF8','#0369A1','#0C4A6E',54)}<div><b>${t[1]}</b><span>${t[2]}</span></div></div>`).join('')}</div>`);
 const about=sec('split',`<div class="rv"><h2>About Space Technologies</h2><p>Space Technologies is a software services company that builds web and mobile applications, advises on technology, supplies skilled developers and runs digital marketing, all under one roof.</p><p>We work with startups and established businesses, combining senior engineering, clear communication and a simple process so every project ships on time and keeps improving after launch.</p><p>${A('about','Read our story →','tl')}</p></div><div class="rv">${fig({f:'hub',fl:['Your product','Build','Advise','Staff','Market'],c:B1},'What Space Technologies does')}</div>`);
 const svc=sec('alt',hd('What we do','One team for building, advising and growing your business.')+`<div class="bento">${CATK.map((k,i)=>`<a class="bt rv b${i}" href="#${k}"><div class="cimg">${artSvg(CATS[k].art,'h')}</div><div class="bti"><h3>${CATS[k].name}</h3><p>${CATS[k].tag}</p><span class="more">Explore →</span></div></a>`).join('')}</div>`);
 const tech=sec('mq',hd('Technologies we use')+`<div class="marq"><div class="track">${DATA.tech.concat(DATA.tech).map(t=>`<span>${t}</span>`).join('')}</div></div>`);
 const stats=`<section class="statband"><div class="wrap sb">${[['7','states across India'],['5','service lines under one roof'],['16','technologies in daily use'],['1','working day to reply']].map(x=>`<div class="rv"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></section>`;
 const models=sec('',hd('Ways to work with us','Choose the model that matches your project and budget.')+cards([['gantt','Fixed-price project','Clear scope, milestones and a fixed quote for websites, apps and systems.','outsourcing-project-based'],['teamplus','Dedicated team','Full-time engineers working as part of your team on a monthly rate.','outsourcing-dedicated-developers'],['clock','Part-time and hourly','Buy the hours you need for maintenance and small features.','outsourcing-part-time']].map((m,i)=>`<a class="tc rv" href="#${m[3]}">${i==1?tileG(m[0],56):tile(m[0],'#38BDF8','#0369A1','#0C4A6E',56)}<h3>${m[1]}</h3><p>${m[2]}</p><span class="more">Learn more →</span></a>`)));
 const enq=sec('alt',`<div class="two"><div class="rv"><h2>Have a question? Send us an enquiry</h2><p class="lead">Share a few details and our team will get back to you within one working day.</p>${stat('7','states across India')}<p>Space Technologies has a presence in 7 states, so there is a team near you.</p></div><div>${form()}</div></div>`);
 return hero_+trust+about+svc+tech+stats+phases()+models+why()+industries()+sec('alt',hd('Frequently asked questions')+faq(DATA.homeFaq))+enq+band();
}
function about(){
 const vals=[['Clarity first','We explain choices and costs in plain language.','chat'],['Craft and care','Clean code, tested features and tidy hand-overs.','code'],['Ownership','We treat your product like our own and stay accountable.','shield'],['Always learning','We invest time in new tools and in each other.','cap']];
 return hero('Company','About Space Technologies','Who we are and how we work with clients.',art({h:'planet',c:B1,alt:'Space Technologies planet logo'}),A('contact-enquiry','Talk to us','btn')+A('how-we-work','How we work','btn alt'))+
 sec('split',`<div class="rv"><h2>Who we are</h2><p>Space Technologies is a software services company that builds web and mobile applications, advises on technology, supplies skilled developers and runs digital marketing, all under one roof.</p><p>We work with startups and established businesses, combining senior engineering, clear communication and a simple process so every project ships on time and keeps improving after launch.</p><p>With a presence in 7 states across India, we keep teams close to clients and deliver projects remotely to businesses anywhere.</p></div><div class="rv">${fig({f:'hub',fl:['Space Technologies','Software','Apps','Consulting','Marketing'],c:B1},'Our service lines')}</div>`)+
 sec('alt',hd('What we stand for','Four values that shape every project.')+cards(vals.map((v,i)=>tcard(v[2],v[0],v[1],i%2)),'g4'))+
 sec('',hd('What clients can expect')+cards(['Software and marketing under one roof','Senior-led delivery on every project','Presence in 7 states across India','A single point of contact and quick replies','Weekly demos and honest estimates','Full ownership of code and assets'].map(x=>`<div class="pt rv">${x}</div>`),'g3'))+
 sec('alt',hd('Our service lines')+`<div class="chips">${CATK.map(k=>A(k,CATS[k].name)).join('')}${A('careers','Careers')}</div>`)+phases()+band();
}
function how(){
 return hero('Company','How We Work','A simple four-step process from idea to launch.',art({h:'docs',k:'plan',c:B1,ch:['Discover','Design','Build'],alt:'Project plan documents'}))+
 sec('',hd('Our four phases','Every project follows the same clear path, so you always know what comes next.')+`<div class="grid g2">${DATA.phases.map((p,i)=>`<div class="ph rv"><span class="n">${i+1}</span><h3>${p[0]}</h3><p>${p[1]}</p><ul>${p[2].map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>`)+
 sec('alt',hd('How we communicate')+cards([['chat','One point of contact','A single person who knows your project and replies quickly.'],['gantt','Shared board','See tasks, progress and next steps at any time.'],['browser','Weekly demos','Working software you can click through, not slide decks.'],['doc','Written summaries','Short notes after each meeting and milestone.']].map((x,i)=>tcard(x[0],x[1],x[2],i%2)),'g4'))+
 sec('',hd('Quality and security built in')+cards(['Code reviews on every change','Automated tests for key features','Staging environment before go-live','NDAs and access control','Regular backups and updates','Documentation and clean hand-over'].map(x=>`<div class="pt rv">${x}</div>`),'g3'))+
 sec('alt',hd('Frequently asked questions')+faq(DATA.generalFaq))+band();
}

 const det=CONFIG.PHONE||CONFIG.EMAIL?`<p class="cd">${CONFIG.PHONE?`<a href="tel:${esc(CONFIG.PHONE.replace(/\s/g,''))}">${esc(CONFIG.PHONE)}</a>`:''}${CONFIG.PHONE&&CONFIG.EMAIL?' · ':''}${CONFIG.EMAIL?`<a href="mailto:${esc(CONFIG.EMAIL)}">${esc(CONFIG.EMAIL)}</a>`:''}</p>`:'';
 return hero('Contact',"Let's talk about your project",'Tell us about your project. We usually reply within one working day.',art({h:'map',c:B1,ch:['7 states','Remote delivery'],alt:'Map with office locations'}),A('contact-enquiry','Send an enquiry','btn')+A('contact-locations','Our locations','btn alt'))+
 sec('',`<div class="two"><div class="rv"><h2>Our presence</h2>${stat('7','states across India')}<p class="lead">Space Technologies has a presence in 7 states, so there is a team near you.</p>${det}</div><div>${form()}</div></div>`)+
 sec('alt',hd('What happens next','From your first message to a clear plan.')+steps([['We reply','Within one working day, from a real person.'],['Discovery call','We understand your goals, users and budget.'],['Proposal','Scope, timeline and a clear quote.'],['Kick-off','Your team and ours start building.']]))+band();
}
function enquiryPage(){
 return hero('Enquiry form','Tell us what you need','Fill in the form and we will reply within one working day.',art({h:'docs',k:'mail',c:B1,ch:['Reply in 1 day','No obligation'],alt:'Enquiry documents'}))+
 sec('',`<div class="two"><div class="rv"><h2>What to include</h2><ul class="ticks">${['What you want to build or improve','Who your users or customers are','Your preferred timeline and budget range','Any existing website, app or documents'].map(x=>`<li>${x}</li>`).join('')}</ul><p>Do not worry if you are unsure about details. We will guide you in the first call.</p></div><div>${form()}</div></div>`)+band();
}
function locations(){
 return hero('Locations','Our presence in 7 states','Teams close to your business, with remote delivery across India.',art({h:'map',c:B1,ch:['7 states','Pan-India delivery'],alt:'Locations map'}))+
 sec('',`<div class="two"><div class="rv">${stat('7','states across India')}<p class="lead">Space Technologies has a presence in 7 states, so there is a team near you.</p>${CONFIG.STATES?`<div class="chips">${CONFIG.STATES.split(',').map(x=>`<span>${esc(x.trim())}</span>`).join('')}</div>`:''}</div><div class="rv">${cards([['pin','Local teams','People near you for meetings and workshops.'],['cloud','Remote delivery','Projects delivered to clients anywhere in India.'],['chat','One point of contact','The same person, whichever location you work with.']].map((x,i)=>tcard(x[0],x[1],x[2],i%2)),'g1')}</div></div>`)+band();
}
const PAGES={home,about,'how-we-work':how,careers:careersPage,contact,'contact-enquiry':enquiryPage,'contact-locations':locations};
CATK.forEach(k=>PAGES[k]=()=>catPage(k));
Object.keys(SUBS).forEach(id=>PAGES[id]=()=>subPage(id));

/* ---------- shell ---------- */
const NAV=CATK.map(k=>[CATS[k].nav,k,DATA.catSubs[k].map(i=>[i,SUBS[i].name])]).concat([['About','about',[['about','About Us'],['how-we-work','How We Work']]],['Careers','careers',DATA.catSubs.careers.map(i=>[i,SUBS[i].name])],['Contact','contact',[['contact-enquiry','Send Enquiry'],['contact-locations','Locations']]]]);
document.body.insertAdjacentHTML('afterbegin',`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0B2545" flood-opacity=".18"/></filter><linearGradient id="dgbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF4FF"/><stop offset="1" stop-color="#FFF6D6"/></linearGradient></defs></svg>`);
const LOGO=`<a class="logo" href="#home" aria-label="Space Technologies home">${logoSvg('L1')}<span class="wm"><b>Space</b><em>Technologies</em></span></a>`;
document.getElementById('hdr').innerHTML=`<div class="wrap bar">${LOGO}<nav id="nv" aria-label="Main"><ul>${NAV.map(n=>`<li class="dd"><a href="#${n[1]}">${n[0]}</a><button class="car" aria-label="Show ${n[0]} pages" aria-expanded="false">&#9662;</button><ul>${n[2].map(s=>`<li><a href="#${s[0]}">${s[1]}</a></li>`).join('')}</ul></li>`).join('')}</ul></nav><a class="btn hq" href="#contact-enquiry">Get a quote</a><button id="mb" aria-expanded="false" aria-controls="nv">Menu</button></div>`;
document.getElementById('ftr').innerHTML=`<div class="wrap fg"><div>${LOGO}<p>Software, apps, consulting, outsourcing and digital marketing, all under one roof.</p>${CONFIG.PHONE||CONFIG.EMAIL?`<p>${esc(CONFIG.PHONE)} ${esc(CONFIG.EMAIL)}</p>`:''}</div><div><h4>Services</h4><ul>${CATK.map(k=>`<li>${A(k,CATS[k].name)}</li>`).join('')}</ul></div><div><h4>Company</h4><ul><li>${A('about','About Us')}</li><li>${A('how-we-work','How We Work')}</li><li>${A('careers','Careers')}</li><li>${A('contact','Contact')}</li><li>${A('contact-enquiry','Send an enquiry')}</li></ul></div></div><div class="wrap fb"><p>© ${new Date().getFullYear()} Space Technologies. All rights reserved.</p></div>`;
document.getElementById('fab').innerHTML=A('contact-enquiry','Enquiry');
const mb=document.getElementById('mb'),nv=document.getElementById('nv');
mb.addEventListener('click',()=>{const o=nv.classList.toggle('open');mb.setAttribute('aria-expanded',o);});
document.querySelectorAll('.car').forEach(b=>b.addEventListener('click',()=>{const li=b.parentNode,o=li.classList.toggle('open');b.setAttribute('aria-expanded',o);}));

function rev(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1});document.querySelectorAll('.rv').forEach(el=>io.observe(el));}
function show(){
 let id=location.hash.slice(1);if(!PAGES[id])id='home';
 document.getElementById('m').innerHTML=PAGES[id]();
 document.title=(id=='home'?'Space Technologies | Software, Apps, Consulting & Digital Marketing':nameOf(id)+' | Space Technologies');
 const top=SUBS[id]?(SUBS[id].cat):(['about','how-we-work'].includes(id)?'about':(id.startsWith('contact')?'contact':id));
 document.querySelectorAll('nav>ul>li>a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+top));
 nv.classList.remove('open');document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'));
 window.scrollTo(0,0);rev();
}
document.addEventListener('submit',e=>{const f=e.target;if(!f.matches('[data-form]'))return;e.preventDefault();const m=f.querySelector('.msg'),d=Object.fromEntries(new FormData(f).entries());
 if(!d.name||!d.email||!d.message){m.textContent='Please fill in your name, email and message.';return;}
 if(CONFIG.FORM_ACTION){fetch(CONFIG.FORM_ACTION,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(d)}).then(r=>{if(!r.ok)throw 0;m.textContent='Thank you! We have received your enquiry and will reply within one working day.';f.reset();}).catch(()=>{m.textContent='Sorry, we could not send your enquiry. Please try again.';});}
 else if(CONFIG.EMAIL){location.href='mailto:'+CONFIG.EMAIL+'?subject='+encodeURIComponent('Enquiry: '+d.service)+'&body='+encodeURIComponent('Name: '+d.name+'\nPhone: '+d.phone+'\nEmail: '+d.email+'\n\n'+d.message);m.textContent='Opening your email app…';}
 else{m.textContent='Thank you! (Preview mode: open index.html, set EMAIL or FORM_ACTION in CONFIG so enquiries reach you.)';f.reset();}
});
addEventListener('hashchange',show);show();
})();
